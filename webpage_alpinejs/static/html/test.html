<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Face Alignment</title>
	
	<!-- SCRIPTS -->
	<script src="//unpkg.com/alpinejs" defer></script>
	<script src="/static/js/demo.js"></script>

	<!-- CSS -->
	<link rel="stylesheet" href="/static/css/output.css">
</head>
<body>

<div x-data="demo" class="p-5 flex flex-col gap-y-5">
	<h1 class="text-xl">Model explorer - TFM Jorge Moreno</h1>

	<template x-if="hasLoaded">
		<div class="flex flex-col gap-y-2">
			<div>
				<label for="input-file">Seleccionar imagenes: </label>
				<label for="input-file" x-text="selectedImages.length + ' imagen(es) seleccionadas'" :class="selectedImages.length === 0 ? 'text-error' : 'text-success'"></label>
				<input type="file" name="input-file" id="input-file" class="hidden" multiple>
			</div>

			<div class="flex items-center gap-x-1">
				<label for="gpu">Usar GPU</label>
				<input type="checkbox" name="gpu" id="gpu" class="checkbox checkbox-primary" x-model="useGpu">
			</div>

			<div>
				<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-y-2 gap-x-3">
					<template x-for="model in Object.keys(models)">
						<div class="flex flex-col border rounded-box px-2 py-1">
							<p x-text="model" class="font-semibold"></p>
							<div class="grid grid-cols-1 gap-y-1">
								<template x-for="size in Object.keys(models[model])">
									<div class="flex justify-between">
										<label :for="model + size" x-text="size"></label>
										<input type="checkbox" class="checkbox checkbox-primary" :name="model + size" :id="model + size" @change="toggleModel(model, size)">
									</div>
								</template>
							</div>
						</div>
					</template>
				</div>
			</div>

			<div class="w-full md:w-auto">
				<input type="button" value="Ejecutar" @click="await run()" class="btn btn-primary" :disabled="isProcessing || selectedImages.length === 0 || selectedModels.size === 0">

				<span x-show="isProcessing">
					Loading
					<span class="loading loading-spinner loading-sm"></span>
				</span>
			</div>
		</div>
	</template>

	<template x-if="!hasLoaded">
		<div>
			<p>
				Loading
				<span class="loading loading-spinner loading-sm"></span>
			</p>
		</div>
	</template>

	<!-- Display results -->
	<div class="w-full grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3">
		<template x-for="(result, index) in results">
			<div class="p-5">
				<template x-for="label in result.labels" :key="label.colorHex" x-show="result.labels.length > 0">
					<div class="flex items-center mb-2">
						<div class="w-3 h-3 mr-1 rounded-full border border-white" :style="label.style"></div>
						<span x-text="`${label.model} - ${label.size} (${label.time} ms)`" class="label text-sm"></span>
					</div>
				</template>

				<template x-if="result.labels.length === 0">
					<p class="label text-sm">No se ha encontrado ninguna cara</p>
				</template>
	
				<canvas :id="'canvas_' + index" class="w-full"></canvas>
			</div>
		</template>
	</div>

</div>
	
</body>
</html>
