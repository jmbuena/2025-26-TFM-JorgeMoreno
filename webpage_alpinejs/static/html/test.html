<body>

<div x-data="demo">
	<h1>Hello</h1>

	<template x-if="hasLoaded">
		<div>
			<fieldset class="flex flex-col" style="display: flex; flex-direction: column;">
				<div>
					<label for="gpu">Usar GPU</label>
					<input type="checkbox" name="gpu" id="gpu">
				</div>
	
				<div style="display: flex; gap: 10px;">
					<template x-for="model in Object.keys(models)">
						<div style="display: flex; flex-direction: column;">
							<p x-text="model"></p>
							<div>
								<template x-for="size in Object.keys(models[model])">
									<div style="display: flex; justify-content: end;">
										<label :for="model + size" x-text="size"></label>
										<input type="checkbox" :name="model + size" :id="model + size" @change="toggleModel(model, size)">
									</div>
								</template>
							</div>
						</div>
					</template>
				</div>
	
				<div>
					<label for="input-file">Seleccionar imagen de entrada</label>
					<input type="file" name="input-file" id="input-file">
				</div>
			</fieldset>
		</div>
	</template>

	<template x-if="!hasLoaded">
		<div>
			<p>Loading</p>
		</div>
	</template>
	

	<input type="button" value="Ejecutar" @click="run">

	<template x-for="label in labels" :key="label.colorHex">
		<div>
			<label x-text="label.model"></label>
			(<label x-text="label.size"></label>)
			<input type="color" x-bind:value="label.colorHex">
		</div>
	</template>
	
	<canvas id="canvas" style="max-width: 50vw;"></canvas>
</div>
